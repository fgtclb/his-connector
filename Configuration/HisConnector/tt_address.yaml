name: tt_address
description: 'Imports relevant fields from HIS to tt_address'
filter:
  language: 'de'
  person:
    roles: [3, 69]
    # custom:
    #   - 'person.createdAt > 123'
    #   - 'person.hasRole(123)'
fieldMapping:
  FGTCLB\HisClientFacade\Model\Person:
    tableName: tt_address
    identifierField: description
    fields:
      gender:
        sourceField: 'person.gender.getUniquename()'
        defaultValue: ''
        valueMapping:
          - source: 'M'
            target: 'm'
          - source: 'W'
            target: 'f'
      first_name:
        sourceField: 'person.firstname'
      last_name:
        sourceField: 'person.surname'
      title:
        sourceField: 'person.title?.getShorttext()'
      birthday:
        sourceField: 'person.dateofbirth'
        # valueProcessing:
        #   - convertToTimestamp
      company:
        sourceField: 'person.getFunctions().first()?.postAddress?.company ?? person.getFunctions().first()?.orgUnit?.displayText'
      position:
        sourceField: 'person.getFunctions().first()?.type?.defaultText'
      address:
        sourceField: 'person.getFunctions().first()?.postAddress?.street'
      city:
        sourceField: 'person.getFunctions().first()?.postAddress?.city'
      zip:
        sourceField: 'person.getFunctions().first()?.postAddress?.postcode'
      region:
        sourceField: 'person.getFunctions().first()?.postAddress?.state'
      country:
        sourceField: 'person.getFunctions().first()?.postAddress?.country?.getDefaulttext()'
      building:
        sourceField: 'person.getFunctions().first()?.room?.getBuildingDefaulttext()~" ("~person.getFunctions().first()?.room?.getCampusDefaulttext()~")"'
      room:
        sourceField: 'person.getFunctions().first()?.room?.getDefaulttext()'
      email:
        sourceField: 'person.getContactDetails().first()?.emailAddresses.onlyInDomain("business").first()?.email'
      phone:
        sourceField: 'person.getContactDetails().first()?.phoneNumbers.onlyInDomain("business").onlyOfType("phone").first()?.phoneNumber'
      mobile:
        sourceField: 'person.getContactDetails().first()?.phoneNumbers.onlyInDomain("business").onlyOfType("mobile").first()?.phoneNumber'
      www:
        sourceField: 'person.getContactDetails().first()?.hyperlinks.onlyInDomain("business").onlyOfType("www").first()?.hyperlink'
      # image:
      #   sourceField: 'person.getPictures(1)'
      #   valueProcessing:
      #     - referenceFile

  # OrgUnit:
  #   - source: id
  #     target:


